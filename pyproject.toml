[project]
name = "sims"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "livekit-agents~=1.8",
    "python-dotenv>=1.2.4",
    "sqlmodel>=0.0.48",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
# Domain classes are named Test*, so only collect classes ending in Tests.
python_classes = ["*Tests"]
