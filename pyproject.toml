[project]
name = "sims"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.0",
    "livekit-agents~=1.8",
    "python-dotenv>=1.2.4",
    "sqlmodel>=0.0.48",
    "uvicorn>=0.54.0",
]

[project.scripts]
sims = "cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Installed editable, so cli.py at the repo root is importable through the .pth path.
packages = ["agents", "core", "regression_tests", "simulations", "api"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
# Domain classes are named Test*, so only collect classes ending in Tests.
python_classes = ["*Tests"]
